</style></head><body><main><header class="top"><div><div class="week">WEEK 24 · 石門智繪客</div><h1>安全、公平地用 AI：選定我的專題</h1></div><div class="badge">中年級好懂版</div></header><p class="goal">知道使用作品要說明來源、重要資料要再確認、私人資料不能亂給，並完成一頁專題計畫。</p><div class="content"><section class="panel"><h2>難詞小幫手</h2><div class="words"><div class="word"><b>引用</b><span>清楚說明文字、圖片或資料從哪裡來</span></div><div class="word"><b>隱私</b><span>保護自己和別人的私人資料</span></div><div class="word"><b>公平</b><span>不因為身分或資料不足，讓某些人一直吃虧</span></div></div></section><section class="panel"><h2>今天一步一步做</h2><div class="steps"><div class="step"><b>1</b><span>判斷四種情況：抄別人的作品、錯誤消息、私人資料和不公平。</span></div><div class="step"><b>2</b><span>從之前的藝術或自然作品找一個真的想解決的問題。</span></div><div class="step"><b>3</b><span>寫出要幫誰、在什麼時候用、要做出什麼，以及怎樣算成功。</span></div></div></section></div><div class="footer">黃凱揚老師｜桃園市龍潭區石門國民小學</div></main></body></html>
