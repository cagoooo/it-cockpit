</style></head><body><main><header class="top"><div><div class="week">WEEK 27 · 石門智繪客</div><h1>先做一個能試的小作品</h1></div><div class="badge">中年級好懂版</div></header><p class="goal">把想法畫成步驟和畫面，只做最重要的功能，讓別人可以實際試用。</p><div class="content"><section class="panel"><h2>難詞小幫手</h2><div class="words"><div class="word"><b>原型</b><span>先做來試、還可以一直修改的小作品</span></div><div class="word"><b>核心功能</b><span>作品最重要、最能幫上忙的功能</span></div><div class="word"><b>使用者</b><span>真的會操作這個作品的人</span></div></div></section><section class="panel"><h2>今天一步一步做</h2><div class="steps"><div class="step"><b>1</b><span>用故事格畫出使用者從開始到完成的過程。</span></div><div class="step"><b>2</b><span>如果只能做一個功能，就先做最能解決問題的那一個。</span></div><div class="step"><b>3</b><span>每完成一小段就試一次，記下哪些是自己做的、哪些有請 AI 幫忙。</span></div></div></section></div><div class="footer">黃凱揚老師｜桃園市龍潭區石門國民小學</div></main></body></html>
