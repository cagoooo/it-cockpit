</style></head><body><main><header class="top"><div><div class="week">WEEK 15 · 石門智繪客</div><h1>把指令說清楚：找錯、修改、再試一次</h1></div><div class="badge">中年級好懂版</div></header><p class="goal">寫出別人真的做得到的清楚指令，並學會先猜結果、試做、找錯、修改和再試。</p><div class="content"><section class="panel"><h2>難詞小幫手</h2><div class="words"><div class="word"><b>除錯</b><span>找出錯誤、修改，再試一次</span></div><div class="word"><b>條件</b><span>符合某種情況時才要做的事</span></div><div class="word"><b>版本</b><span>作品每次修改後留下的一份紀錄</span></div></div></section><section class="panel"><h2>今天一步一步做</h2><div class="steps"><div class="step"><b>1</b><span>寫指令，讓老師扮演機器人走到目的地。</span></div><div class="step"><b>2</b><span>先猜會走到哪裡，再一步一步試，圈出第一個錯誤。</span></div><div class="step"><b>3</b><span>一次只改一個地方，再試一次，保留修改前後兩版。</span></div></div></section></div><div class="footer">黃凱揚老師｜桃園市龍潭區石門國民小學</div></main></body></html>
