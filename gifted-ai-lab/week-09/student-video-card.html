</head><body><main><header class="top"><div><div class="week">WEEK 09 · 石門智繪客</div><h1>AI 會不會不公平？一起整理石門生活資料</h1></div><div class="badge">中年級好懂版</div></header><p class="goal">找出資料少了哪些人或情況，並設計一張安全、不收私人資料的紀錄表。</p><div class="content"><section class="panel"><h2>難詞小幫手</h2><div class="words"><div class="word"><b>偏見</b><span>因為例子不完整，讓判斷對某些人不公平</span></div><div class="word"><b>代表性</b><span>資料有沒有包含各種不同情況</span></div><div class="word"><b>個資</b><span>姓名、照片、電話等能認出一個人的資料</span></div></div></section><section class="panel"><h2>今天一步一步做</h2><div class="steps"><div class="step"><b>1</b><span>比較不同人畫的房子、麵包和電話，看看畫法有什麼不同。</span></div><div class="step"><b>2</b><span>從石門校園或鱻魚特色學園選一個想觀察的主題。</span></div><div class="step"><b>3</b><span>設計紀錄欄位，拿掉姓名、臉部照片和聯絡方式。</span></div></div></section></div><div class="footer">黃凱揚老師｜桃園市龍潭區石門國民小學</div></main></body></html>
