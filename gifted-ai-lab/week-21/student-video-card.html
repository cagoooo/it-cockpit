</head><body><main><header class="top"><div><div class="week">WEEK 21 · 石門智繪客</div><h1>怎麼跟 AI 說清楚？一起想出新點子</h1></div><div class="badge">中年級好懂版</div></header><p class="goal">先想自己的點子，再把任務、格式和規則說清楚，最後檢查 AI 的回答能不能相信。</p><div class="content"><section class="panel"><h2>難詞小幫手</h2><div class="words"><div class="word"><b>提示詞</b><span>你對 AI 說的任務句</span></div><div class="word"><b>格式</b><span>希望答案長什麼樣子</span></div><div class="word"><b>查證</b><span>再找可靠資料確認 AI 有沒有說對</span></div></div></section><section class="panel"><h2>今天一步一步做</h2><div class="steps"><div class="step"><b>1</b><span>先不開 AI，自己寫出 5 個點子。</span></div><div class="step"><b>2</b><span>告訴 AI 要扮演誰、完成什麼、怎麼回答和不能做什麼。</span></div><div class="step"><b>3</b><span>比較三次回答，分成「可以用」、「要再確認」和「不用」。</span></div></div></section></div><div class="footer">黃凱揚老師｜桃園市龍潭區石門國民小學</div></main></body></html>
