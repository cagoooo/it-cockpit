<style>
  :root{--ink:#132f33;--paper:#f8f4e9;--white:#fffdf8;--coral:#e05c45;--teal:#168277;--yellow:#f2bf46;--blue:#3674a8;}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink)}
  button,a{font:inherit}.stage{height:100%;display:grid;place-items:center;padding:12px 12px 78px}.slide{display:none;width:min(1280px,calc((100vh - 100px)*16/9),calc(100vw - 24px));aspect-ratio:16/9;background:var(--paper);border:1px solid #ffffff33;position:relative;overflow:hidden;box-shadow:0 22px 70px #0006}.slide.active{display:grid}.slide::after{content:attr(data-page);position:absolute;right:26px;bottom:20px;font:700 12px/1 'JetBrains Mono',monospace;color:#132f3388}
  .cover-slide{grid-template-columns:1.05fr .95fr}.cover-copy{padding:6.5% 6%;display:flex;flex-direction:column;justify-content:center}.cover-img{width:100%;height:100%;object-fit:cover}.code{font:700 clamp(11px,1.2vw,16px)/1.4 'JetBrains Mono',monospace;color:var(--coral)}h1{font-size:clamp(40px,5.3vw,82px);line-height:1.05;margin:14px 0 18px;letter-spacing:0}h2{font-size:clamp(32px,4.3vw,64px);line-height:1.12;margin:0 0 28px;letter-spacing:0}.lead{font-size:clamp(17px,1.8vw,28px);line-height:1.55;margin:0}.tag{display:inline-flex;align-self:flex-start;background:var(--yellow);padding:8px 13px;font-weight:800;margin-top:24px}.content-slide{grid-template-rows:auto 1fr;padding:5.5% 6% 5%}.rule{height:5px;width:100px;background:var(--coral);margin-bottom:16px}.big-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:center}.big-card{background:var(--white);border-top:7px solid var(--teal);padding:20px;min-height:190px}.big-card b{display:block;font-size:clamp(20px,2.1vw,32px);margin-bottom:10px}.big-card p{font-size:clamp(15px,1.45vw,22px);line-height:1.55;margin:0}.prompt{display:grid;grid-template-columns:110px 1fr;gap:26px;align-items:center;background:var(--white);padding:28px}.prompt-mark{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:white;font-size:48px;font-weight:900}.prompt q{font-size:clamp(25px,3.4vw,52px);line-height:1.45;font-weight:800}.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:stretch}.task-box{padding:26px;background:var(--white);border-left:8px solid var(--yellow)}.task-box h3{font-size:clamp(21px,2.1vw,32px);margin:0 0 12px}.task-box ol,.task-box ul{font-size:clamp(16px,1.55vw,24px);line-height:1.7;margin:0;padding-left:28px}.exit{display:grid;grid-template-columns:.8fr 1.2fr;gap:28px;align-items:center}.exit-number{font:700 clamp(76px,12vw,180px)/1 'JetBrains Mono',monospace;color:var(--coral)}.exit-copy p{font-size:clamp(22px,2.8vw,42px);font-weight:800;margin:0 0 20px}.exit-copy span{font-size:clamp(15px,1.6vw,23px)}
  .controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:8px;background:#fffdf8f2;border:1px solid #ffffff44;padding:7px;border-radius:8px;box-shadow:0 10px 30px #0005}.ctrl{min-width:44px;height:44px;border:1px solid #132f3326;background:white;color:var(--ink);border-radius:6px;font-weight:900;cursor:pointer}.ctrl:hover{border-color:var(--ink)}.counter{min-width:76px;text-align:center;font:700 13px/1 'JetBrains Mono',monospace}.week-select{height:44px;max-width:220px;border:1px solid #132f3326;background:white;color:var(--ink);border-radius:6px;padding:0 10px;font-weight:800}.home{text-decoration:none;display:grid;place-items:center}.hint{position:fixed;top:12px;right:12px;color:#fff9;font:600 11px/1.3 'JetBrains Mono',monospace}.progress{position:fixed;left:0;bottom:0;height:5px;background:var(--yellow);transition:width .2s}
  @media(max-width:760px){.stage{padding:6px 6px 70px}.cover-copy,.content-slide{padding:5%}.cover-slide{grid-template-columns:1fr}.cover-img{position:absolute;right:0;top:0;width:40%;opacity:.2}.big-grid{gap:7px}.big-card{padding:10px;min-height:0}.task-grid{gap:9px}.task-box{padding:12px}.controls{width:calc(100% - 12px);justify-content:center}.week-select{min-width:0;flex:1}.hint{display:none}}
</style>
<script src="../assets/webp-fallback.js" defer></script>
</head>
<body>
<main id="stage" class="stage" aria-live="polite"></main>
<div class="hint">← → 切換｜F 全螢幕｜Esc 返回</div>
<nav class="controls" aria-label="簡報控制列">
  <a class="ctrl home" href="index.html" aria-label="回到資優班專區" title="回到資優班專區">⌂</a>
  <select id="weekSelect" class="week-select" aria-label="選擇週次"></select>
  <button id="prev" class="ctrl" aria-label="上一張">←</button><span id="counter" class="counter">1 / 6</span><button id="next" class="ctrl" aria-label="下一張">→</button>
  <button id="full" class="ctrl" aria-label="全螢幕" title="全螢幕">⛶</button>
</nav>
<div id="progress" class="progress"></div>
<script>
const DATA={
3:{date:'115.9.23',title:'AI 是什麼：生活中的智慧工具',goal:'用證據判斷生活工具是否含有 AI',concepts:[['感知','看見、聽見或讀取環境'],['學習','從例子與資料找規律'],['影響','AI 的判斷會影響人與社會']],hook:'自動門會自己開，所以它一定是 AI 嗎？',steps:['觀察 4 種生活工具','分成 AI／非 AI／不確定','挑最難的一張提出證據'],check:'我認為＿＿是／不是 AI，因為＿＿；我的證據是＿＿。',output:'AI 判斷卡＋30 秒理由錄音'},
6:{date:'115.10.14',title:'資料集與機器如何學習',goal:'說明資料、找規律與預測的關係',concepts:[['資料集','許多有意義的例子'],['找規律','比較相同與不同線索'],['預測','面對新例子做判斷']],hook:'只看三張圖，能猜出老師心中的分類規則嗎？',steps:['少量圖卡先猜規則','Quick, Draw! 記錄猜對猜錯','畫出資料→規律→預測'],check:'資料變多不一定更準，還要注意＿＿。',output:'機器學習三步驟流程圖'},
9:{date:'115.11.4',title:'資料偏見與石門生活資料採集',goal:'設計有代表性、必要且安全的資料表',concepts:[['代表性','不同情況都有被看見'],['必要性','只收任務真正需要的資料'],['隱私','不用姓名、臉部與聯絡資訊']],hook:'如果所有訓練圖片都來自同一個人，AI 會認得大家的畫嗎？',steps:['找出房子與電話圖的偏見','補上缺少的例子','設計石門生活資料表'],check:'誰的經驗還沒有出現在我的資料裡？',output:'石門生活資料採集表 v1'},
12:{date:'115.11.25',title:'資料整理與演算法三元素',goal:'用輸入、處理、輸出描述解題流程',concepts:[['輸入','系統收到什麼資料'],['處理','依什麼規則一步步做'],['輸出','最後交給使用者什麼結果']],hook:'「幫我整理一下」對電腦來說，哪裡不夠清楚？',steps:['清理空白、重複與格式','把生活流程拆成 IPO','畫出專題演算法初稿'],check:'這一步能不能讓完全不知情的人照著完成？',output:'資料表 v2＋IPO 演算法單'},
15:{date:'115.12.16',title:'精準指令與除錯思維',goal:'完成預測、測試、找錯、修正與重測',concepts:[['預測','先說明應該發生什麼'],['測試','嚴格照指令執行'],['除錯','一次修一處並重新驗證']],hook:'如果我完全照你的字面指令走，能走到終點嗎？',steps:['寫出第一版路徑指令','圈出第一個出錯位置','只改一處後重新測試'],check:'我改了＿＿，因為測試時發現＿＿。',output:'精準指令 v2＋除錯紀錄'},
18:{date:'116.3.10',title:'Scratch 互動與分類器概念',goal:'完成 Scratch 規則分類器並測試邊界案例',concepts:[['規則式','人先寫好如果／否則'],['學習式','機器從標記資料找規律'],['測試','一般、邊界、錯誤輸入都要試']],hook:'只靠「如果／否則」，能分好所有例子嗎？',steps:['先寫分類規則表','用 Scratch 完成互動','用 6 筆案例測試並修正'],check:'我的規則最可能在＿＿情況下失敗。',output:'Scratch 分類器 v1＋測試表'},
21:{date:'116.3.31',title:'提示工程與 AI 創意發想',goal:'用六元素改寫提示詞並比較輸出',concepts:[['人先想','先寫自己的五個點子'],['AI 擴充','換角度、分類、補充可能性'],['人判斷','採用、查證或捨棄']],hook:'同一個問題，為什麼換一句提示就得到不同答案？',steps:['不用 AI 先寫 5 個點子','製作提示詞 v1 到 v3','把回覆標成綠黃紅'],check:'這個點子是我先想到的；AI 幫我＿＿；我最後決定＿＿。',output:'提示詞三版本＋回覆比較表'},
24:{date:'116.4.21',title:'AI 倫理與專題定題',goal:'完成負責任且可測試的一頁專題計畫',concepts:[['引用','說明內容與素材從哪裡來'],['查證','AI 回答仍要找證據'],['公平與隱私','保護人，也檢查誰被忽略']],hook:'AI 做得到，就一定可以直接拿來用嗎？',steps:['判斷四種 AI 倫理情境','選一個真實使用者問題','寫下三個成功標準'],check:'我的專題幫助＿＿在＿＿情境解決＿＿。',output:'AI 使用規範＋一頁專題計畫'},
27:{date:'116.5.12',title:'原型設計與作品製作',goal:'做出可操作、可測試的最小可行原型',concepts:[['使用流程','開始、操作、回饋、完成'],['核心功能','只做最能解決問題的一件事'],['版本','保留每次修改與理由']],hook:'如果今天只能完成一個功能，哪一個最值得做？',steps:['畫出使用者故事板','決定今天不做的功能','完成 MVP 並第一次試用'],check:'我的核心功能是＿＿，它解決＿＿。',output:'流程圖＋介面草圖＋MVP v1'},
30:{date:'116.6.2',title:'測試精緻化與成果發表',goal:'用測試證據改良並清楚發表學習歷程',concepts:[['觀察','測試時不提示、不辯解'],['修正','每項改動對應一筆證據'],['發表','也說明限制、倫理與下一步']],hook:'作品能在沒有你解釋時，讓使用者自己完成嗎？',steps:['請真實使用者不提示試用','依證據完成 MVP v2','進行 3–5 分鐘成果發表'],check:'測試者在＿＿卡住，所以我把＿＿改成＿＿。',output:'MVP v2＋成果發表＋完整歷程'}
};
const stage=document.querySelector('#stage'),select=document.querySelector('#weekSelect');let week=Number(new URLSearchParams(location.search).get('week'))||3,index=0;
function safeWeek(){if(!DATA[week])week=3;return DATA[week]}
function renderSelect(){select.innerHTML=Object.entries(DATA).map(([w,d])=>`<option value="${w}" ${Number(w)===week?'selected':''}>第 ${w} 週｜${d.title}</option>`).join('')}
function render(){const d=safeWeek(),w=String(week).padStart(2,'0');stage.innerHTML=`
<section class="slide cover-slide" data-page="01 / 06"><div class="cover-copy"><div class="code">WEEK ${w} · ${d.date} · 90 MIN</div><h1>${d.title}</h1><p class="lead">${d.goal}</p><span class="tag">黃凱揚老師｜石門國小資優班</span></div><img class="cover-img" data-fallback-src="assets/gifted-lab-cover.png" src="./assets/gifted-lab-cover.webp" alt="資訊科技專題學習情境" decoding="async" loading="eager"></section>
<section class="slide content-slide" data-page="02 / 06"><div><div class="rule"></div><h2>今天先想這一題</h2></div><div class="prompt"><div class="prompt-mark">?</div><q>${d.hook}</q></div></section>
<section class="slide content-slide" data-page="03 / 06"><div><div class="rule"></div><h2>三個關鍵概念</h2></div><div class="big-grid">${d.concepts.map(x=>`<div class="big-card"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div></section>
<section class="slide content-slide" data-page="04 / 06"><div><div class="rule"></div><h2>第一節｜理解與小實驗</h2></div><div class="task-grid"><div class="task-box"><h3>先觀察</h3><ol><li>${d.steps[0]}</li><li>把想法與證據說出來</li><li>允許第一次答案被修正</li></ol></div><div class="task-box"><h3>45 分鐘檢查點</h3><ul><li>我能說出自己的理由</li><li>我能指出一筆證據</li><li>我知道哪裡還不確定</li></ul></div></div></section>
<section class="slide content-slide" data-page="05 / 06"><div><div class="rule"></div><h2>第二節｜製作、測試、留下版本</h2></div><div class="task-grid"><div class="task-box"><h3>動手做</h3><ol><li>${d.steps[1]}</li><li>${d.steps[2]}</li><li>保留第一版與修改版</li></ol></div><div class="task-box"><h3>本次可見產出</h3><p class="lead">${d.output}</p></div></div></section>
<section class="slide content-slide" data-page="06 / 06"><div><div class="rule"></div><h2>離開教室前</h2></div><div class="exit"><div class="exit-number">01</div><div class="exit-copy"><p>${d.check}</p><span>把作品與反思存入學習歷程，下次從這裡繼續。</span></div></div></section>`;
 const slides=[...document.querySelectorAll('.slide')];index=Math.min(index,slides.length-1);slides[index].classList.add('active');document.querySelector('#counter').textContent=`${index+1} / ${slides.length}`;document.querySelector('#progress').style.width=`${(index+1)/slides.length*100}%`;renderSelect();
}
function move(delta){const n=document.querySelectorAll('.slide').length;index=Math.max(0,Math.min(n-1,index+delta));render()}
document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();select.onchange=()=>{week=Number(select.value);index=0;history.replaceState(null,'',`?week=${String(week).padStart(2,'0')}`);render()};
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key.toLowerCase()==='f')document.querySelector('#full').click();if(e.key==='Escape'&&!document.fullscreenElement)location.href='index.html'});
let sx=0;stage.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)move(dx<0?1:-1)},{passive:true});render();
</script>
</body>
</html>
