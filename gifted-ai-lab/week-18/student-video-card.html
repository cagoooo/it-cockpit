</head><body><main><header class="top"><div><div class="week">WEEK 18 · 石門智繪客</div><h1>用 Scratch 做分類小幫手</h1></div><div class="badge">中年級好懂版</div></header><p class="goal">做出可以操作的 Scratch 分類作品，並比較「照人寫規則」和「從很多例子學」有什麼不同。</p><div class="content"><section class="panel"><h2>難詞小幫手</h2><div class="words"><div class="word"><b>分類器</b><span>把東西分到不同類別的小幫手</span></div><div class="word"><b>規則式</b><span>完全照人先寫好的規則判斷</span></div><div class="word"><b>邊界例子</b><span>很難分、剛好卡在兩類中間的例子</span></div></div></section><section class="panel"><h2>今天一步一步做</h2><div class="steps"><div class="step"><b>1</b><span>選回收、AI／不是 AI 或校園問題當分類主題。</span></div><div class="step"><b>2</b><span>用如果／否則積木完成分類互動。</span></div><div class="step"><b>3</b><span>準備容易分、很難分和錯誤的資料，各試兩次。</span></div></div></section></div><div class="footer">黃凱揚老師｜桃園市龍潭區石門國民小學</div></main></body></html>
