</head><body><main><header class="top"><div><div class="week">WEEK 03 · 石門智繪客</div><h1>AI 就在生活裡：哪些工具會自己學？</h1></div><div class="badge">中年級好懂版</div></header><p class="goal">能用自己的話說出 AI 是什麼，也能看線索判斷生活工具有沒有用到 AI。</p><div class="content"><section class="panel"><h2>難詞小幫手</h2><div class="words"><div class="word"><b>AI</b><span>會從資料找線索，幫忙判斷或產生內容的電腦方法</span></div><div class="word"><b>資料</b><span>讓 AI 學習或判斷的文字、圖片、聲音和數字</span></div><div class="word"><b>證據</b><span>能支持你想法的觀察、測試或資料</span></div></div></section><section class="panel"><h2>今天一步一步做</h2><div class="steps"><div class="step"><b>1</b><span>看看導航、影片推薦、自動門和掃地機器人有什麼不同。</span></div><div class="step"><b>2</b><span>把 10 張工具卡分成「AI」、「不是 AI」和「還不確定」。</span></div><div class="step"><b>3</b><span>挑一張最難分的卡，用「我覺得……因為我看到……」說明。</span></div></div></section></div><div class="footer">黃凱揚老師｜桃園市龍潭區石門國民小學</div></main></body></html>
