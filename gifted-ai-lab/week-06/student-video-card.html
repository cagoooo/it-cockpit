</head><body><main><header class="top"><div><div class="week">WEEK 06 · 石門智繪客</div><h1>AI 怎麼從很多例子學會？</h1></div><div class="badge">中年級好懂版</div></header><p class="goal">知道 AI 會從很多例子找規律，再猜新的答案，也能畫出學習三步驟。</p><div class="content"><section class="panel"><h2>難詞小幫手</h2><div class="words"><div class="word"><b>資料集</b><span>放在一起、讓 AI 學習的一大組例子</span></div><div class="word"><b>規律</b><span>很多例子中重複出現的線索</span></div><div class="word"><b>預測</b><span>根據已知線索猜新的答案</span></div></div></section><section class="panel"><h2>今天一步一步做</h2><div class="steps"><div class="step"><b>1</b><span>先看少量圖卡猜規則，再加入更多圖卡，看看想法有沒有改變。</span></div><div class="step"><b>2</b><span>玩 Quick, Draw!，記下電腦猜對和猜錯的時候。</span></div><div class="step"><b>3</b><span>畫出「看很多例子→找規律→猜新答案」的流程。</span></div></div></section></div><div class="footer">黃凱揚老師｜桃園市龍潭區石門國民小學</div></main></body></html>
