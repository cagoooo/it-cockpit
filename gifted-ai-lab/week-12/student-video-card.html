</style></head><body><main><header class="top"><div><div class="week">WEEK 12 · 石門智繪客</div><h1>把資料整理好，再寫出清楚步驟</h1></div><div class="badge">中年級好懂版</div></header><p class="goal">整理一小份資料，再用「放進什麼、怎麼做、得到什麼」說清楚解題步驟。</p><div class="content"><section class="panel"><h2>難詞小幫手</h2><div class="words"><div class="word"><b>演算法</b><span>照順序完成任務的解題步驟</span></div><div class="word"><b>輸入</b><span>一開始放進去的資料</span></div><div class="word"><b>輸出</b><span>完成步驟後得到的結果</span></div></div></section><section class="panel"><h2>今天一步一步做</h2><div class="steps"><div class="step"><b>1</b><span>找出資料裡的空白、重複和不同寫法。</span></div><div class="step"><b>2</b><span>把早餐或借書分成「放進什麼、怎麼做、得到什麼」。</span></div><div class="step"><b>3</b><span>替自己的專題畫出第一版解題流程。</span></div></div></section></div><div class="footer">黃凱揚老師｜桃園市龍潭區石門國民小學</div></main></body></html>
