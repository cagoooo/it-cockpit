<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="石門智繪客資訊科技課程數位量規與學期報告中心"><title>學期報告中心｜石門智繪客</title><link rel="icon" href="assets/gifted-favicon-32.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="reports.css"><script src="../assets/webp-fallback.js" defer></script>
</head><body><main class="shell"><header class="top"><div><div class="eyebrow">教師私人工作區</div><h1>學期報告中心</h1><p>整理十週匿名學習證據；分數與最後文字由教師確認。</p></div><div class="actions"><a class="btn" href="index.html">回年度總覽</a><button class="btn primary" id="printReport">列印／存成 PDF</button></div></header><div class="privacy"><b>資料邊界：</b>內容只讀取這台裝置的瀏覽器紀錄，不會自動上傳。請勿填入姓名、臉部、聯絡方式或其他可識別資料。</div><section id="summary" class="summary"></section><section class="panel data-panel"><h2>十週資料完整度</h2><div style="overflow:auto"><table class="week-table"><thead><tr><th>週次</th><th>教師狀態</th><th>量規平均</th><th>學習證據</th><th>編輯</th></tr></thead><tbody id="weekRows"></tbody></table></div><div class="actions" style="margin-top:12px"><button class="btn" id="exportData">匯出匿名備份</button><label class="btn" for="importFile">匯入匿名備份</label><input class="file-input" id="importFile" type="file" accept="application/json"></div></section><section class="panel"><h2>選擇報告版本</h2><div class="mode-switch"><button class="active" data-mode="teacher">教師紀錄版</button><button data-mode="parent">家長閱讀版</button><button data-mode="school">校內成果版</button></div><label><b>教師綜合評語</b><textarea class="report-edit" id="finalComment" placeholder="依作品與觀察證據輸入綜合評語；不要填入可識別個資。"></textarea></label><label class="confirm"><input type="checkbox" id="reportConfirmed"><span><b>教師已確認整份報告</b><br>AI 或程式只協助整理，最終內容與評量責任由教師確認。</span></label></section><article id="reportOutput" class="panel report-output"></article></main><script src="reports.js"></script></body></html>
